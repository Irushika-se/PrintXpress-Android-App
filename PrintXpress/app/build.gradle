plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.printxpress'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.printxpress"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'com.google.android.material:material:1.12.0'
            force 'androidx.constraintlayout:constraintlayout:2.2.0'
            force 'androidx.recyclerview:recyclerview:1.3.2'
            force 'androidx.cardview:cardview:1.0.0'
            force 'androidx.room:room-runtime:2.6.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room for SQLite
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // Glide for images
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
}
